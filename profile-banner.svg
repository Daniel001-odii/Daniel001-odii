<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="350" viewBox="0 0 1200 350" role="img" aria-labelledby="title desc">
  <title id="title">Daniel Odii | Software Engineer</title>
  <desc id="desc">A dark technical banner highlighting backend engineering, applied AI, and product engineering.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="0.55" stop-color="#111a2e"/>
      <stop offset="1" stop-color="#17112a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6ee7b7"/>
      <stop offset="0.52" stop-color="#67e8f9"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <radialGradient id="glowA">
      <stop offset="0" stop-color="#22d3ee" stop-opacity=".26"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity=".25"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#9fb4d0" stroke-opacity=".07" stroke-width="1"/>
    </pattern>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
  </defs>
  <rect width="1200" height="350" rx="26" fill="url(#bg)"/>
  <rect width="1200" height="350" rx="26" fill="url(#grid)"/>
  <circle cx="1000" cy="80" r="260" fill="url(#glowA)"/>
  <circle cx="1110" cy="270" r="230" fill="url(#glowB)"/>

  <g opacity=".62" fill="none" stroke="url(#accent)" stroke-width="1.2">
    <path d="M750 67h92l28 28h80l30-30h90"/>
    <path d="M785 115h55l24-24h54l35 35h94l24-24h60"/>
    <path d="M760 260h70l26-26h55l30 30h95l20-20h64"/>
    <path d="M875 180h65l28-28h68l22 22h66"/>
    <path d="M950 215h52l22 22h58l24-24h46"/>
  </g>
  <g fill="#67e8f9">
    <circle cx="842" cy="67" r="3.5"/><circle cx="950" cy="95" r="3.5"/><circle cx="1074" cy="65" r="3.5"/>
    <circle cx="840" cy="115" r="3.5"/><circle cx="1052" cy="126" r="3.5"/><circle cx="1147" cy="102" r="3.5"/>
    <circle cx="830" cy="260" r="3.5"/><circle cx="941" cy="264" r="3.5"/><circle cx="1096" cy="264" r="3.5"/>
    <circle cx="940" cy="180" r="3.5"/><circle cx="1058" cy="174" r="3.5"/><circle cx="1124" cy="174" r="3.5"/>
  </g>
  <g fill="#67e8f9" opacity=".28" filter="url(#softGlow)">
    <circle cx="950" cy="95" r="10"/><circle cx="1052" cy="126" r="10"/><circle cx="941" cy="264" r="10"/>
  </g>

  <g transform="translate(68 64)">
    <rect x="0" y="0" width="196" height="30" rx="15" fill="#13283a" stroke="#2dd4bf" stroke-opacity=".42"/>
    <circle cx="16" cy="15" r="4" fill="#6ee7b7"/>
    <text x="29" y="20" fill="#a7f3d0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="1.7">BUILDING IN PRODUCTION</text>
  </g>
  <text x="64" y="158" fill="#f8fafc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="54" font-weight="750" letter-spacing="-1.8">Daniel Odii</text>
  <rect x="66" y="179" width="110" height="4" rx="2" fill="url(#accent)"/>
  <text x="66" y="222" fill="#dbeafe" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="550">Software Engineer</text>
  <text x="66" y="253" fill="#94a3b8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15">Backend Systems  ·  Applied AI  ·  Product Engineering</text>
  <g transform="translate(66 283)" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="650" letter-spacing="1">
    <rect x="0" y="0" width="123" height="28" rx="8" fill="#ffffff" fill-opacity=".055" stroke="#94a3b8" stroke-opacity=".22"/>
    <text x="14" y="18" fill="#cbd5e1">API DESIGN</text>
    <rect x="134" y="0" width="137" height="28" rx="8" fill="#ffffff" fill-opacity=".055" stroke="#94a3b8" stroke-opacity=".22"/>
    <text x="148" y="18" fill="#cbd5e1">AI INTEGRATION</text>
    <rect x="282" y="0" width="154" height="28" rx="8" fill="#ffffff" fill-opacity=".055" stroke="#94a3b8" stroke-opacity=".22"/>
    <text x="296" y="18" fill="#cbd5e1">RELIABLE DELIVERY</text>
  </g>
  <path d="M64 32h190" stroke="url(#accent)" stroke-width="2" stroke-linecap="round" opacity=".85"/>
</svg>
